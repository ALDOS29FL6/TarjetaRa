<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarjeta RA - Aldo</title>

    <link rel="stylesheet" href="style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body>

    <a-scene embedded arjs>

        <!-- Marcador Hiro -->
        <a-marker preset="hiro">

            <!-- Foto -->
            <a-image src="foto.jpeg" position="0 0.8 0" rotation="-90 0 0" width="1.5" height="1.5">
            </a-image>

            <!-- Nombre -->
            <a-text value="Aldo Efrain Solis Parga" position="0 0.1 0" rotation="-90 0 0" align="center" color="#00aaff"
                width="3">
            </a-text>

            <!-- Carrera -->
            <a-text value="Estudiante en Ingenieria en Computacion" position="0 -0.15 0" rotation="-90 0 0"
                align="center" color="white" width="2.5">
            </a-text>

            <!-- Teléfono -->
            <a-text value="Tel: 492 228 4695" position="0 -0.4 0" rotation="-90 0 0" align="center" color="white"
                width="2">
            </a-text>

            <!-- Correo -->
            <a-text value="aldoparga91@gmail.com" position="0 -0.65 0" rotation="-90 0 0" align="center" color="white"
                width="2">
            </a-text>

        </a-marker>

        <!-- Cámara -->
        <a-entity camera></a-entity>

    </a-scene>

    <script src="script.js"></script>

</body>

</html>
